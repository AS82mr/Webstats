plugins {
    id 'java'
    // Updated plugin that supports Java 21
    id 'io.github.goooler.shadow' version '8.1.8'
}

group = 'webstats'
version = '2.0.0'

// Java 21 is correct for 1.21.8 servers
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://repo.codemc.org/repository/maven-public/' }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.21-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.5'
    compileOnly 'de.tr7zw:item-nbt-api-plugin:2.11.3'

    implementation 'redis.clients:jedis:5.0.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}

shadowJar {
    relocate 'redis.clients', 'webstats.libs.redis'
    relocate 'com.google.gson', 'webstats.libs.gson'
    relocate 'org.json', 'webstats.libs.json'

    // This adds the unique timestamp (e.g., webstats-2.0.0-17654321.jar)
    // So it never overwrites the old file
    archiveClassifier.set(System.currentTimeMillis().toString())
}

build.dependsOn shadowJar